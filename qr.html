<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>STAR NET - قارئ الباركود</title>
<style>
:root{color-scheme:dark;--panel:#1d293b;--accent:#18a058;--blue:#2563eb;--text:#f8fafc;--muted:#cbd5e1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(145deg,#0b1220,#17283c);font-family:Tahoma,Arial,sans-serif;color:var(--text);display:flex;justify-content:center;align-items:center;padding:18px}
main{width:100%;max-width:520px;background:rgba(29,41,59,.96);border:1px solid #40516a;border-radius:20px;padding:20px;box-shadow:0 18px 55px #0008}
h1{font-size:23px;text-align:center;margin:4px 0 8px}
p{color:var(--muted);text-align:center;line-height:1.8;font-size:14px}
video{display:block;width:100%;max-height:52vh;min-height:190px;background:#05080d;border-radius:14px;object-fit:cover;margin:14px 0}
button,.filelabel{display:block;width:100%;border:0;border-radius:12px;padding:14px;margin-top:10px;color:white;font-size:16px;font-weight:bold;text-align:center;cursor:pointer}
#start{background:var(--accent)}#stop{background:#475569}#back{background:#334155}.filelabel{background:var(--blue)}
#status{background:#0f172a;border:1px solid #334155;border-radius:12px;padding:12px;min-height:52px;text-align:center;line-height:1.7;margin-top:12px;color:#e2e8f0}
#result{direction:ltr;text-align:center;word-break:break-all;color:#a7f3d0}
input[type=file]{display:none}
small{display:block;color:#94a3b8;text-align:center;margin-top:14px;line-height:1.7}
</style>
</head>
<body>
<main>
  <h1>قارئ بطاقات STAR NET</h1>
  <p>وجّه كاميرا الهاتف نحو رمز QR الخاص ببطاقة الإنترنت. تتم قراءة الرمز محليًا على الهاتف دون إرسال الصورة إلى أي موقع خارجي.</p>
  <video id="video" autoplay playsinline muted></video>
  <button id="start" type="button">تشغيل الكاميرا</button>
  <button id="stop" type="button">إيقاف الكاميرا</button>
  <label class="filelabel" for="imageFile">اختيار صورة QR من الهاتف</label>
  <input id="imageFile" type="file" accept="image/*">
  <div id="status" role="status" aria-live="polite">اضغط تشغيل الكاميرا واسمح باستخدامها.</div>
  <div id="result"></div>
  <button id="back" type="button">العودة إلى صفحة الدخول</button>
  <small>إذا لم تعمل الكاميرا، تحقق من إذن الكاميرا للمتصفح أو استخدم اختيار صورة QR.</small>
</main>
<canvas id="canvas" hidden></canvas>
<script src="js/qr_packed.js"></script>
<script>
(function(){
  "use strict";
  var video=document.getElementById("video"), canvas=document.getElementById("canvas");
  var ctx=canvas.getContext("2d",{willReadFrequently:true});
  var status=document.getElementById("status"), result=document.getElementById("result");
  var stream=null, timer=null, busy=false, finished=false;
  function say(message){status.textContent=message;}
  function stopCamera(){
    if(timer){clearTimeout(timer);timer=null;}
    if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}
    try{video.pause();video.srcObject=null;}catch(e){}
  }
  function getUsername(raw){
    var value=String(raw||"").trim();
    try{
      if(/^https?:\/\//i.test(value)){
        var u=new URL(value);
        value=u.searchParams.get("username")||u.searchParams.get("user")||
          u.searchParams.get("login")||u.pathname.split("/").filter(Boolean).pop()||value;
      }else if(/[?&](username|user|login)=/i.test(value)){
        var q=new URLSearchParams(value.replace(/^[^?]*\\?/,""));
        value=q.get("username")||q.get("user")||q.get("login")||value;
      }
    }catch(e){}
    return String(value).replace(/^(username|user|login)\\s*[:=]\\s*/i,"").trim();
  }
  function returnWithCard(raw){
    if(finished)return;
    var username=getUsername(raw);
    if(!username||username.length>128){
      say("تمت قراءة الرمز، لكن محتواه ليس اسم مستخدم صالحًا. تأكد أن QR يحتوي رقم البطاقة.");
      return;
    }
    finished=true; stopCamera();
    result.textContent="تمت قراءة البطاقة: "+username;
    say("تمت القراءة. جارٍ الرجوع إلى صفحة الدخول…");
    window.location.replace("http://l.net/login?qruser="+encodeURIComponent(username));
  }
  function decoderCallback(value){
    busy=false;
    if(value && !(value instanceof Error)) returnWithCard(value);
  }
  function scan(){
    if(!stream||busy||finished){if(stream&&!finished)timer=setTimeout(scan,250);return;}
    if(video.readyState<2||!video.videoWidth){timer=setTimeout(scan,250);return;}
    try{
      canvas.width=video.videoWidth;canvas.height=video.videoHeight;
      ctx.drawImage(video,0,0,canvas.width,canvas.height);
      qrcode.canvas_qr2=canvas;qrcode.qrcontext2=ctx;qrcode.callback=decoderCallback;
      busy=true;qrcode.decode();
    }catch(e){busy=false;}
    if(stream&&!finished)timer=setTimeout(scan,400);
  }
  async function startCamera(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      say("هذا المتصفح لا يتيح تشغيل الكاميرا هنا. استخدم اختيار صورة QR من الهاتف.");return;
    }
    stopCamera();finished=false;say("بانتظار إذن الكاميرا…");
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"}}});
      video.srcObject=stream;await video.play();
      say("الكاميرا تعمل. وجّهها نحو رمز QR.");scan();
    }catch(e){
      stopCamera();say("تعذر تشغيل الكاميرا أو لم يُمنح الإذن. تحقق من أذونات المتصفح، أو اختر صورة QR.");
    }
  }
  function decodeImage(file){
    if(!file)return;
    finished=false;busy=true;say("جارٍ قراءة الصورة محليًا…");
    var reader=new FileReader();
    reader.onload=function(){
      qrcode.callback=decoderCallback;
      try{qrcode.decode(reader.result);}
      catch(e){busy=false;say("تعذر قراءة الرمز. جرّب صورة أوضح واجعل رمز QR كاملًا داخل الصورة.");}
    };
    reader.onerror=function(){busy=false;say("تعذر فتح الصورة المختارة.");};
    reader.readAsDataURL(file);
  }
  document.getElementById("start").addEventListener("click",startCamera);
  document.getElementById("stop").addEventListener("click",function(){stopCamera();say("تم إيقاف الكاميرا.");});
  document.getElementById("imageFile").addEventListener("change",function(e){decodeImage(e.target.files&&e.target.files[0]);e.target.value="";});
  document.getElementById("back").addEventListener("click",function(){stopCamera();window.location.href="http://l.net/login";});
  window.addEventListener("pagehide",stopCamera);
})();
</script>
</body>
</html>
