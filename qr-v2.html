<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>STAR NET - قارئ QR</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#0b1220,#17283c);font-family:Tahoma,Arial,sans-serif;color:#f8fafc;display:flex;justify-content:center;align-items:center;padding:16px}
main{width:100%;max-width:520px;background:#1d293b;border:1px solid #40516a;border-radius:20px;padding:18px}
h1{font-size:23px;text-align:center;margin:4px 0 8px}p{color:#cbd5e1;text-align:center;line-height:1.8;font-size:14px}
video{display:block;width:100%;max-height:52vh;min-height:210px;background:#05080d;border-radius:14px;object-fit:cover;margin:14px 0}
button,.filelabel{display:block;width:100%;border:0;border-radius:12px;padding:14px;margin-top:10px;color:white;font-size:16px;font-weight:bold;text-align:center;cursor:pointer}
#start,#use{background:#18a058}#stop{background:#475569}#back{background:#334155}.filelabel{background:#2563eb}
#status{background:#0f172a;border:1px solid #334155;border-radius:12px;padding:12px;min-height:52px;text-align:center;line-height:1.7;margin-top:12px;color:#e2e8f0}
#result{direction:ltr;text-align:center;word-break:break-all;color:#a7f3d0;font-size:20px;margin-top:10px}
input[type=file]{display:none}small{display:block;color:#94a3b8;text-align:center;margin-top:14px;line-height:1.7}
</style>
</head>
<body><main>
<h1>قارئ بطاقات STAR NET</h1>
<p>ضع رمز QR داخل إطار الكاميرا وانتظر حتى تتم القراءة. فك الرمز يتم على الهاتف ولا تُرسل الصورة إلى أي خادم.</p>
<video id="video" autoplay playsinline muted></video>
<button id="start" type="button">بدء المسح بالكاميرا</button>
<button id="stop" type="button">إيقاف الكاميرا</button>
<label class="filelabel" for="imageFile">مسح QR من صورة محفوظة</label>
<input id="imageFile" type="file" accept="image/*">
<div id="status" role="status" aria-live="polite">اضغط «بدء المسح بالكاميرا».</div>
<div id="result"></div>
<button id="use" type="button" hidden>استخدام هذه البطاقة وتسجيل الدخول</button>
<button id="back" type="button">العودة إلى صفحة الدخول</button>
<small>اجعل الرمز واضحًا وكاملًا داخل الصورة، وابتعد قليلًا إذا كان قريبًا جدًا من العدسة.</small>
</main>
<canvas id="canvas" hidden></canvas>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(function(){
"use strict";
var video=document.getElementById("video"),canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d",{willReadFrequently:true});
var status=document.getElementById("status"),result=document.getElementById("result"),useBtn=document.getElementById("use");
var stream=null,raf=0,cardValue="",running=false,lastScan=0;
function say(t){status.textContent=t;}
function stopCamera(){running=false;if(raf)cancelAnimationFrame(raf);raf=0;if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}try{video.pause();video.srcObject=null;}catch(e){}}
function getUsername(raw){
 var value=String(raw||"").trim();
 try{
  if(/^https?:\/\//i.test(value)){var u=new URL(value);value=u.searchParams.get("username")||u.searchParams.get("user")||u.searchParams.get("login")||u.pathname.split("/").filter(Boolean).pop()||value;}
  else if(/[?&](username|user|login)=/i.test(value)){var q=new URLSearchParams(value.replace(/^[^?]*\?/,""));value=q.get("username")||q.get("user")||q.get("login")||value;}
 }catch(e){}
 return String(value).replace(/^(username|user|login)\s*[:=]\s*/i,"").trim();
}
function found(raw){
 var name=getUsername(raw);
 if(!name||name.length>128){say("تم العثور على QR لكن محتواه ليس اسم مستخدم صالحًا. راجع محتوى البطاقة.");return;}
 cardValue=name;stopCamera();result.textContent="رقم البطاقة: "+name;useBtn.hidden=false;say("نجح المسح! اضغط الزر الأخضر لإدخال البطاقة.");
}
function scanFrame(now){
 if(!running)return;
 if(now-lastScan>180 && video.readyState>=2 && video.videoWidth){
  lastScan=now;
  var scale=Math.min(1,900/video.videoWidth),w=Math.max(1,Math.round(video.videoWidth*scale)),h=Math.max(1,Math.round(video.videoHeight*scale));
  canvas.width=w;canvas.height=h;ctx.drawImage(video,0,0,w,h);
  try{var data=ctx.getImageData(0,0,w,h);var code=window.jsQR(data.data,w,h,{inversionAttempts:"attemptBoth"});if(code&&code.data){found(code.data);return;}}
  catch(e){say("تعذر تحليل إطار الكاميرا: "+(e.message||e));}
 }
 raf=requestAnimationFrame(scanFrame);
}
async function startCamera(){
 stopCamera();cardValue="";result.textContent="";useBtn.hidden=true;
 if(typeof window.jsQR!=="function"){say("مكتبة قارئ QR لم تُحمّل. تحقق من اتصال الإنترنت ثم أعد فتح الصفحة.");return;}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){say("المتصفح لا يدعم فتح الكاميرا هنا. استخدم اختيار صورة QR.");return;}
 say("جارٍ طلب إذن الكاميرا…");
 try{
  stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}});
  video.srcObject=stream;await video.play();running=true;say("المسح يعمل الآن… وجّه الرمز إلى الكاميرا وثبّت الهاتف لحظة.");
  var track=stream.getVideoTracks()[0];if(track&&track.applyConstraints){track.applyConstraints({advanced:[{focusMode:"continuous"}]}).catch(function(){});}
  raf=requestAnimationFrame(scanFrame);
 }catch(e){stopCamera();say("تعذر تشغيل الكاميرا: "+(e.message||e));}
}
function decodeImage(file){
 if(!file)return;
 if(typeof window.jsQR!=="function"){say("مكتبة قارئ QR لم تُحمّل. تحقق من الإنترنت.");return;}
 say("جارٍ تحليل الصورة محليًا…");
 var img=new Image();
 img.onload=function(){
  var scale=Math.min(1,1400/img.width),w=Math.round(img.width*scale),h=Math.round(img.height*scale);
  canvas.width=w;canvas.height=h;ctx.drawImage(img,0,0,w,h);
  try{var d=ctx.getImageData(0,0,w,h),code=jsQR(d.data,w,h,{inversionAttempts:"attemptBoth"});if(code&&code.data)found(code.data);else say("لم نعثر على QR في الصورة. اختر صورة أوضح يظهر فيها الرمز كاملًا.");}
  catch(e){say("تعذر تحليل الصورة: "+(e.message||e));}
 };
 img.onerror=function(){say("تعذر فتح الصورة المختارة.");};img.src=URL.createObjectURL(file);
}
document.getElementById("start").addEventListener("click",startCamera);
document.getElementById("stop").addEventListener("click",function(){stopCamera();say("تم إيقاف الكاميرا.");});
document.getElementById("imageFile").addEventListener("change",function(e){decodeImage(e.target.files&&e.target.files[0]);e.target.value="";});
useBtn.addEventListener("click",function(){if(cardValue)window.location.href="http://l.net/login?qruser="+encodeURIComponent(cardValue);});
document.getElementById("back").addEventListener("click",function(){stopCamera();window.location.href="http://l.net/login";});
window.addEventListener("pagehide",stopCamera);
})();
</script>
</body></html>
